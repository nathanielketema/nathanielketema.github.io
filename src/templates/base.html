<!DOCTYPE html>
<html lang="en-US">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{[title]s}</title>
		<meta name="description" content="{[description]s}">
		<link rel="icon" href="/favicon.png" type="image/png">
        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
		<link rel="canonical" href="{[site_url]s}{[page_url]s}">
        <link rel="alternate" type="application/rss+xml" title="nathanielketema" href="https://nathanielketema.github.io/feed.xml">
        <script data-goatcounter="https://nathanielketema.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
		<style>
			@font-face {{
				font-family: 'Open Sans';
				src: url('/css/OpenSans-300-Normal.woff2') format('woff2');
				font-weight: 300;
				font-style: normal;
			}}
			@font-face {{
				font-family: 'JetBrains Mono';
				src: url('/css/JetBrainsMono-400-Normal.woff2') format('woff2');
				font-weight: 400;
				font-style: normal;
			}}
			@font-face {{
				font-family: 'JetBrains Mono';
				src: url('/css/JetBrainsMono-700-Normal.woff2') format('woff2');
				font-weight: 700;
				font-style: normal;
			}}
			@font-face {{
				font-family: 'EB Garamond';
				src: url('/css/EBGaramond-400-Normal.woff2') format('woff2');
				font-weight: 400;
				font-style: normal;
			}}
			@font-face {{
				font-family: 'EB Garamond';
				src: url('/css/EBGaramond-400-Italic.woff2') format('woff2');
				font-weight: 400;
				font-style: italic;
			}}
			@font-face {{
				font-family: 'EB Garamond';
				src: url('/css/EBGaramond-700-Normal.woff2') format('woff2');
				font-weight: 700;
				font-style: normal;
			}}
			@font-face {{
				font-family: 'EB Garamond';
				src: url('/css/EBGaramond-700-Italic.woff2') format('woff2');
				font-weight: 700;
				font-style: italic;
			}}
		</style>
		<link rel="stylesheet" href="/css/main.css">
	</head>
	<body>
		<header>
			<nav>
				<a class="me" href="/">nathanielketema</a>
				<a href="/posts/">Posts</a>
				<a href="/resume.pdf">Resume</a>
			</nav>
		</header>
		<main>
			{[content]s}
		</main>
		<footer>
			<p>
				<a href="https://github.com/nathanielketema/nathanielketema.github.io/edit/main/content/{[file_md]s}">
					Fix typo
				</a>
                <a href="/feed.xml">
                    <svg><use href="/assets/icons.svg#rss"></use></svg>
                    Subscribe
                </a>
				<a href="mailto:nathanielketema+blog@gmail.com">
					<svg><use href="/assets/icons.svg#email"></use></svg>
					Get in touch
				</a>
				<a href="https://github.com/nathanielketema">
					<svg><use href="/assets/icons.svg#github"></use></svg>
					nathanielketema
				</a>
			</p>
		</footer>
	</body>
</html>
